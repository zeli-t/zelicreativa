<article class="producto-card">
  <div class="producto-media">
    <a [routerLink]="['/detalle-producto']" [queryParams]="{ producto: slug || nombre }" [attr.aria-label]="nombre" tabindex="-1">
      <img [src]="imagen" alt="" loading="lazy">
    </a>
    @if (oferta) { <span class="oferta">Oferta</span> }
    <button class="btn-favorito" type="button" [attr.aria-label]="'Favorito: ' + nombre"
      [attr.aria-pressed]="favorito" (click)="cambiarFavorito()">
      <i class="bi" [class.bi-heart]="!favorito" [class.bi-heart-fill]="favorito" aria-hidden="true"></i>
    </button>
  </div>
  <div class="producto-info">
    <h3><a [routerLink]="['/detalle-producto']" [queryParams]="{ producto: slug || nombre }">{{ nombre }}</a></h3>
    <div class="precios">
      <strong>${{ precio }}</strong>
      @if (oferta) { <del>${{ precioAnterior }}</del> }
    </div>
    <div class="acciones">
      <button class="agregar" type="button" (click)="agregarAlCarrito()" [attr.aria-label]="'Agregar ' + nombre + ' al carrito'">
        <i class="bi bi-cart-plus" aria-hidden="true"></i> Agregar
      </button>
      <button class="vista" type="button" (click)="abrirQuickView()" [attr.aria-label]="'Vista rápida: ' + nombre" title="Vista rápida">
        <i class="bi bi-eye" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</article>

@if (mostrarQuickView) {
  <app-quick-view [producto]="{ slug, nombre, precio, imagen, descripcion, variantes }" (cerrar)="cerrarQuickView()"></app-quick-view>
}
