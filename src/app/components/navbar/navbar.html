<nav class="nav-tienda" aria-label="Navegación principal">
  <ul class="container enlaces">
    @for (enlace of enlaces; track enlace.ruta) {
      <li>
        <a [routerLink]="enlace.ruta" routerLinkActive="actual" ariaCurrentWhenActive="page">
          {{ enlace.texto }}
        </a>
      </li>
    }
  </ul>
</nav>
