@if (producto) {
<dialog #dialogo aria-label="Vista rápida" (cancel)="cerrarVentana()" (click)="cerrarDesdeFondo($event)">
  <div class="panel">
    <button class="btn-cerrar" type="button" aria-label="Cerrar vista rápida" (click)="cerrarVentana()" autofocus>
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
    <img [src]="producto.imagen" [alt]="producto.nombre">
    <div>
      <h2>{{ producto.nombre }}</h2>
      <p class="precio">${{ producto.precio }}</p>
      @if (producto.descripcion) { <p>{{ producto.descripcion }}</p> }
      @if (producto.variantes.length > 1) {
        <label class="d-block mb-3">Variante
          <select class="form-select" [(ngModel)]="varianteId">
            <option [ngValue]="null" disabled>Selecciona una variante</option>
            @for (variante of producto.variantes; track variante.id) {
              <option [ngValue]="variante.id">{{ variante.nombre }}</option>
            }
          </select>
        </label>
      }
      @if (!producto.variantes.length) { <p>No hay variantes disponibles.</p> }
      <button type="button" class="zeli-btn" (click)="agregarAlCarrito()"
        [disabled]="!producto.variantes.length || (producto.variantes.length > 1 && varianteId === null)">
        <i class="bi bi-cart-plus me-2" aria-hidden="true"></i> Agregar al carrito
      </button>
    </div>
  </div>
</dialog>
}
