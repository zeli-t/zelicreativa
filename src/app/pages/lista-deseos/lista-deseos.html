<div class="container py-5">

  <h2 class="text-center mb-4">
    <i class="bi bi-heart-fill"></i>
    Mis favoritos
  </h2>


  <!-- SIN FAVORITOS -->

  <div
    *ngIf="favoritos.length === 0"
    class="sin-favoritos text-center py-5">

    <i class="bi bi-heart"></i>

    <h4 class="mt-3">
      No tienes productos favoritos
    </h4>

    <p>
      Cuando encuentres algo que te guste,
      agrégalo a tu lista de deseos.
    </p>

    <a
      routerLink="/inicio"
      class="btn btn-dark mt-2">

      Ver productos

    </a>

  </div>


  <!-- FAVORITOS -->

  <div
    class="row g-4"
    *ngIf="favoritos.length > 0">

    <div
      class="col-6 col-md-3"
      *ngFor="let producto of favoritos">

      <div class="card favorito-card h-100">

        <img
          [src]="producto.imagen"
          [alt]="producto.nombre"
          class="card-img-top">

        <div class="card-body">

          <h5 class="card-title">
            {{ producto.nombre }}
          </h5>

          <p class="precio">
            ${{ producto.precio }}
          </p>

          <button
            class="btn btn-outline-danger w-100"
            (click)="eliminarFavorito(producto.nombre)">

            <i class="bi bi-heartbreak"></i>
            Quitar de favoritos

          </button>

        </div>

      </div>

    </div>

  </div>

</div>
