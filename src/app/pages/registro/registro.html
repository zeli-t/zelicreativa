<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-md-6">

      <div class="card p-4 shadow-sm">

        <h2 class="text-center mb-4">
          Crear cuenta 💕
        </h2>

        <form (ngSubmit)="registrar()" novalidate>
        <label for="registro-nombre">Nombre</label>

        <input
          type="text"
          id="registro-nombre"
          name="nombre"
          autocomplete="name"
          maxlength="100"
          class="form-control mb-3"
          [class.is-invalid]="enviado && !nombre.trim()"
          [class.is-valid]="nombre.trim()"
          placeholder="Nombre"
          [(ngModel)]="nombre">

        <div
          class="invalid-feedback"
          *ngIf="enviado && !nombre.trim()">

          El nombre es obligatorio.

        </div>


        <label for="registro-correo">Correo electrónico</label>

        <input
          type="email"
          id="registro-correo"
          name="correo"
          autocomplete="email"
          class="form-control mb-3"
          [class.is-invalid]="enviado && !emailValido"
          [class.is-valid]="emailValido"
          placeholder="Correo electrónico"
          [(ngModel)]="correo">

        <div
          class="invalid-feedback"
          *ngIf="enviado && !emailValido">

          Escribe un correo electrónico válido.

        </div>


        <label for="registro-password">Contraseña</label>

        <input
          type="password"
          id="registro-password"
          name="password"
          autocomplete="new-password"
          class="form-control mb-3"
          [class.is-invalid]="enviado && password.length < 6"
          [class.is-valid]="password.length >= 6"
          placeholder="Mínimo 6 caracteres"
          [(ngModel)]="password">

        <div
          class="invalid-feedback"
          *ngIf="enviado && password.length < 6">

          La contraseña debe tener mínimo 6 caracteres.

        </div>


        <label for="registro-confirmacion">Confirmar contraseña</label>

        <input
          type="password"
          id="registro-confirmacion"
          name="confirmacion"
          autocomplete="new-password"
          class="form-control mb-3"
          [class.is-invalid]="enviado && confirmarPassword !== password"
          [class.is-valid]="confirmarPassword && confirmarPassword === password"
          placeholder="Confirmar contraseña"
          [(ngModel)]="confirmarPassword">

        <div
          class="invalid-feedback"
          *ngIf="enviado && confirmarPassword !== password">

          Las contraseñas no coinciden.

        </div>


        <button
          class="btn btn-dark w-100"
          type="submit"
          [disabled]="pendiente()">

          {{ pendiente() ? 'Creando cuenta…' : 'Crear cuenta' }}

        </button>
        </form>

        @if (error()) { <p class="text-danger mt-3 mb-0" role="alert">{{ error() }}</p> }
        @if (aviso()) { <p class="mt-3 mb-0" role="status">{{ aviso() }}</p> }

        <p class="text-center mt-3">

          ¿Ya tienes cuenta?

          <a routerLink="/iniciar-sesion">
            Inicia sesión
          </a>

        </p>

      </div>

    </div>

  </div>

</div>
