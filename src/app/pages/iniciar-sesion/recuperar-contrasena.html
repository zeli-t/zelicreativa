<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 shadow-sm">
        <h2 class="text-center mb-4">Recuperar contraseña</h2>
        <form (ngSubmit)="enviar()" novalidate>
          <label for="correo-recuperacion">Correo electrónico</label>
          <input id="correo-recuperacion" name="correo" type="email" autocomplete="email"
            class="form-control mb-3" placeholder="Correo electrónico" [(ngModel)]="correo" required>
          <button class="btn btn-dark w-100" type="submit" [disabled]="pendiente()">
            {{ pendiente() ? 'Enviando…' : 'Enviar enlace de recuperación' }}
          </button>
        </form>
        @if (enviado()) {
          <p class="mt-3 mb-0" role="status">Si hay una cuenta asociada a ese correo, recibirás un enlace para cambiar la contraseña. Revisa también la carpeta de correo no deseado.</p>
        }
        @if (error()) { <p class="text-danger mt-3 mb-0" role="alert">{{ error() }}</p> }
        <p class="text-center mt-3 mb-0"><a routerLink="/iniciar-sesion">Volver a iniciar sesión</a></p>
      </div>
    </div>
  </div>
</div>
